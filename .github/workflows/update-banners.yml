name: Update profile banners

on:
  # Daily: Uptime, Lang (all languages), GitHub Stats
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/today.py"
      - "scripts/update_system_info.py"
      - "system_info.yaml"
      - ".github/workflows/update-banners.yml"

concurrency:
  group: update-profile-banners
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run today.py
        env:
          USER_NAME: ${{ github.repository_owner }}
          # PAT recommended for private repos + full LOC/stats.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
          # Optional repo variable: YYYY-MM-DD
          BIRTHDAY: ${{ vars.BIRTHDAY }}
        run: python scripts/today.py

      - name: Commit and push banner updates
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/dark.svg assets/light.svg

          if [ -d cache ]; then
            git add -f cache || true
          fi

          if git diff --staged --quiet; then
            echo "No banner/cache changes to commit"
            exit 0
          fi

          git commit -m "chore: update profile banners (uptime, languages, stats) [skip ci]"

          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt $i failed; retrying..."
            sleep 5
          done
          echo "Failed to push after retries"
          exit 1
