name: Update profile banners

on:
  # Refresh Uptime, Core.Lang, and GitHub Stats daily (midnight UTC)
  schedule:
    - cron: "0 0 * * *"

  # Allow manual runs from the Actions tab
  workflow_dispatch:

  # Re-run when the script or this workflow changes
  push:
    branches:
      - main
    paths:
      - "today.py"
      - "update_system_info.py"
      - "system_info.yaml"
      - ".github/workflows/update-uptime.yml"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dateutil requests lxml

      - name: Run today.py
        env:
          # Defaults to the repo owner (Patruxs)
          USER_NAME: ${{ github.repository_owner }}
          # Prefer a PAT in secrets.ACCESS_TOKEN (private repos + broader GraphQL).
          # Falls back to the job token for public language/stats updates.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN != '' && secrets.ACCESS_TOKEN || github.token }}
          # Optional: set repo variable BIRTHDAY as YYYY-MM-DD to pin a start date.
          # Without it, Uptime uses the GitHub account created_at date.
          BIRTHDAY: ${{ vars.BIRTHDAY }}
        run: python today.py

      - name: Commit and push banner updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Uptime + Core.Lang + GitHub Stats land in the SVGs
          git add dark.svg light.svg
          if [ -d cache ]; then
            git add cache || true
          fi

          if git diff --staged --quiet; then
            echo "No SVG changes to commit"
            exit 0
          fi

          git commit -m "chore: update profile banners (uptime, languages, stats) [skip ci]"
          git push
