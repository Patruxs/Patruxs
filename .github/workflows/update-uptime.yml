name: Update profile uptime

on:
  # Refresh Uptime once a day (midnight UTC)
  schedule:
    - cron: "0 0 * * *"

  # Allow manual runs from the Actions tab
  workflow_dispatch:

  # Re-run when the script or this workflow changes
  push:
    branches:
      - main
    paths:
      - "today.py"
      - ".github/workflows/update-uptime.yml"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dateutil requests lxml

      - name: Run today.py
        env:
          # Defaults to the repo owner (Patruxs)
          USER_NAME: ${{ github.repository_owner }}
          # Optional: set repo secret ACCESS_TOKEN for full GitHub stats
          # (commits, stars, LOC, followers). Without it, only Uptime is updated.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          # Optional: set repo variable BIRTHDAY as YYYY-MM-DD to pin a start date.
          # Without it, Uptime uses the GitHub account created_at date.
          BIRTHDAY: ${{ vars.BIRTHDAY }}
        run: python today.py

      - name: Commit and push banner updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Uptime always touches these; cache/ only appears with ACCESS_TOKEN stats
          git add dark.svg light.svg
          if [ -d cache ]; then
            git add cache || true
          fi

          if git diff --staged --quiet; then
            echo "No SVG changes to commit"
            exit 0
          fi

          git commit -m "chore: update profile uptime [skip ci]"
          git push
