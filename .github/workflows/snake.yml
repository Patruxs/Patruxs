name: Generate snake animation

on:
  # Run every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allow manual runs
  workflow_dispatch:

  # Run on pushes to main (ignore animation-only commits)
  push:
    branches:
      - main
    paths-ignore:
      - "snake.svg"
      - "snake-dark.svg"
      - "dark.svg"
      - "light.svg"
      - "README.md"
      - "cache/**"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # Keep output branch for raw.githubusercontent.com URLs if needed
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Commit onto main so the profile README can use reliable relative paths
      # (same pattern as dark.svg / light.svg at the top of the README)
      - name: Commit snake SVGs to main
        run: |
          cp dist/snake.svg dist/snake-dark.svg .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg snake-dark.svg
          if git diff --staged --quiet; then
            echo "No snake SVG changes"
            exit 0
          fi
          git commit -m "Update snake animation [skip ci]"
          git push
